[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nm-secrets"
version = "0.1.0"
description = "Versioned, AAD-bound encrypted envelopes for Python applications."
#readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NorthMax Integration Ltd" }]
keywords = ["encryption", "secrets", "aes-gcm", "envelope"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=44,<51",
]

[project.urls]
Repository = "https://github.com/northmax-ie/nm-secrets"
Issues = "https://github.com/northmax-ie/nm-secrets/issues"
#Documentation = "https://github.com/northmax-ie/nm-secrets/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nm_secrets"]
# Ship the PEP 561 marker so type checkers consume the annotations.
artifacts = ["src/nm_secrets/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
#    "/README.md",
#    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
