name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  test-min-cryptography:
    name: test (py3.11, cryptography floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      # Pin cryptography to the exact declared floor (not the latest 44.x), then
      # install without upgrading it, so the minimum supported dependency is
      # actually exercised.
      - run: pip install "cryptography==44.0.0" pytest
      - run: pip install -e . --no-deps
      - run: pytest -q

  test-python-prerelease:
    name: test Python 3.15 prerelease
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  package:
    name: build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # Install the built wheel (not editable) so a packaging omission the
      # editable install would mask is caught here.
      - run: pip install dist/*.whl pytest
      - run: pytest -q

  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history
          fetch-depth: 0
      - name: gitleaks
        # Pinned by digest so the scanner image cannot change under us. The tag
        # is kept for readability; the digest is authoritative. This is v8.21.2;
        # bump the tag and the digest together when updating.
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
